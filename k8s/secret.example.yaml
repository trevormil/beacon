#     --from-literal=ADMIN_TOKEN=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: beacon-env
  namespace: beacon
type: Opaque
stringData:
  ADMIN_TOKEN: "REPLACE_ME"
