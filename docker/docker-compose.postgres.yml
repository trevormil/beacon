services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - beacon-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  beacon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://beacon:${POSTGRES_PASSWORD:-changeme}@postgres:5432/beacon
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in your .env}
      HOST: 0.0.0.0
      PORT: 4747
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BEACON_PORT:-4747}:4747"
    restart: unless-stopped

volumes:
  beacon-postgres-data:
