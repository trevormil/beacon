services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: beacon
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: beacon
    volumes:
      - beacon-mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  beacon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: mongodb://beacon:${MONGO_PASSWORD:-changeme}@mongo:27017/beacon?authSource=admin
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in your .env}
      HOST: 0.0.0.0
      PORT: 4747
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BEACON_PORT:-4747}:4747"
    restart: unless-stopped

volumes:
  beacon-mongo-data:
